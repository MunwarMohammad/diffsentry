[project]
name = "pr-reviewer"
version = "0.1.0"
description = "GitHub App code review pipeline with four LangGraph review agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "celery[redis]>=5.5,<6", "PyJWT[crypto]>=2.10,<3",
  "openai>=2,<3", "langgraph>=1,<2", "prometheus-fastapi-instrumentator>=7,<8",
  "langfuse>=3,<4",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "respx>=0.22,<1", "pyyaml>=6,<7"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
extend-exclude = [".reference"]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
