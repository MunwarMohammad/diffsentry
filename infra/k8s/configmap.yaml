apiVersion: v1
kind: ConfigMap
metadata:
  name: reviewer-config
data:
  ENVIRONMENT: production
  REVIEW_MODE: live
  PUBLISH_REVIEWS: 'false'
  ALLOWED_REPOSITORIES: REPLACE_OWNER/REPLACE_REPO
  OPENAI_MODEL: gpt-4o-mini
  WEBHOOK_URL: http://webhook:8000
  ORCHESTRATOR_URL: http://orchestrator:8000
  PUBLISHER_URL: http://publisher:8000
  LEARNER_URL: http://learner:8000
  LANGFUSE_ENABLED: 'false'
