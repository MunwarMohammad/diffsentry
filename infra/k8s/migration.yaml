apiVersion: batch/v1
kind: Job
metadata:
  name: reviewer-migrate
  namespace: pr-reviewer
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: reviewer:release
        command:
        - alembic
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: reviewer-config
        - secretRef:
            name: reviewer-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
