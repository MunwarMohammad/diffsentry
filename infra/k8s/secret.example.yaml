apiVersion: v1
kind: Secret
metadata:
  name: reviewer-secrets
  namespace: pr-reviewer
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_TLS_POSTGRES_URL
  REDIS_URL: REPLACE_WITH_TLS_REDIS_URL
  GITHUB_WEBHOOK_SECRET: REPLACE_WITH_RANDOM_32_PLUS_CHARACTER_SECRET
  INTERNAL_API_TOKEN: REPLACE_WITH_DIFFERENT_RANDOM_32_PLUS_CHARACTER_SECRET
  GITHUB_APP_ID: REPLACE_WITH_APP_ID
  GITHUB_APP_PRIVATE_KEY: REPLACE_WITH_PEM_CONTENT
  OPENAI_API_KEY: REPLACE_WITH_KEY
