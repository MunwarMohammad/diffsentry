name: Test and integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=reviewer --cov=services --cov-report=term-missing
      - run: uv run python -m scripts.evaluate
      - run: docker compose up -d --build --wait
      - run: uv run python -m scripts.smoke
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: kubectl kustomize infra/k8s > /tmp/reviewer.yaml
