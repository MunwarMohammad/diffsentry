name: Regression evaluation
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
      - run: uv sync --frozen --python 3.12
      - run: uv run python -m scripts.evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: reports/evaluation.json
